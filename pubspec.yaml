name: admin_dashboard
description: "Taj Dentics Admin Dashboard"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.12.4
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2
  go_router: ^17.2.3
  fl_chart: ^0.68.0
  data_table_2: ^2.5.0
  intl: ^0.19.0
  file_saver: ^0.2.0
  csv: ^6.0.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  riverpod_generator: ^4.0.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/ArbFONTS-Cairo-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/ArbFONTS-Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/ArbFONTS-Cairo-Black.ttf
          weight: 900